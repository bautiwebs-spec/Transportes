name: Preview V3 (/v3/)

# Publica la propuesta V3 en https://bautiwebs-spec.github.io/Transportes/v3/
# sin reemplazar la web principal. Compila y publica juntas las tres versiones:
#   main        → /Transportes/      (web principal, sin cambios)
#   redesign-v2 → /Transportes/v2/   (preview anterior, se conserva)
#   redesign-v3 → /Transportes/v3/   (esta propuesta)
on:
  push:
    branches: [redesign-v3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Web principal (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - name: Preview V2 (redesign-v2)
        uses: actions/checkout@v4
        with:
          ref: redesign-v2
          path: v2
      - name: Preview V3 (redesign-v3)
        uses: actions/checkout@v4
        with:
          path: v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compilar web principal
        working-directory: stable
        run: npm ci && npm run build
      - name: Compilar V2 en /Transportes/v2/
        working-directory: v2
        env:
          BASE_PATH: /Transportes/v2/
        run: npm ci && npm run build
      - name: Compilar V3 en /Transportes/v3/
        working-directory: v3
        env:
          BASE_PATH: /Transportes/v3/
        run: npm ci && npm run build
      - name: Unir las tres versiones
        run: |
          mkdir -p stable/dist/v2 stable/dist/v3
          cp -r v2/dist/. stable/dist/v2/
          cp -r v3/dist/. stable/dist/v3/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: stable/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
